openapi: 3.1.0
info:
  title: Governance Research Authorization Check
  version: 1.0.0
  description: |
    Consumer contract required by HC-182, provided by the Governance Node
    (HC-133). The Governance Node owns the decision; the Research Service
    must fail closed when this boundary is unavailable.

    The Governance Node answers for the research access decisions it holds
    (contracts/api/governance/research-requests.v1.yaml). An unknown
    reference, or a decision on another subject, is `404`. Otherwise the
    answer is `approved` only if the decision approved the request, is valid
    now, is for this project, is requested by the project's principal
    investigator or the request's submitter, and covers every target
    organization, every variable, and the population (each requested bound
    inside the requested project population). Otherwise it is `denied` with
    the first failing `reason_code`, in this order: `not_approved`,
    `not_yet_valid`, `expired`, `project_mismatch`, `requester_mismatch`,
    `organization_not_approved`, `variable_not_approved`,
    `population_exceeded`. `purpose` is not compared, and the minimum output
    cell size of the decision is not carried here (OPEN).
paths:
  /v1/research-authorizations/check:
    post:
      operationId: checkResearchAuthorization
      summary: Verify a Governance decision against the exact proposed job.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorizationCheck"}
            examples:
              job001:
                summary: Fictional demo — job-001 of proj-001 under dec-rar-001.
                value:
                  decision_ref: dec-rar-001
                  project_ref: proj-001
                  requested_by: usr-aymen
                  purpose: Aggregate cardiometabolic risk research
                  target_organization_refs: [org-hospital-a, org-hospital-b]
                  data_scope:
                    population: {age_min: 40, age_max: 79, encounter_from: "2024-01-01", encounter_to: "2026-12-31"}
                    variables: [age_band, hba1c]
      responses:
        "200":
          description: Governance-owned authorization result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthorizationDecision"}
              examples:
                approved:
                  summary: Fictional demo — dec-rar-001 covers job-001 on the demo date.
                  value:
                    decision_ref: dec-rar-001
                    status: approved
                    approved_organization_refs: [org-hospital-a, org-hospital-b]
                    approved_variables: [age_band, sex, hba1c, treated_hypertension]
                    authority_organization_ref: org-governance
                    valid_until: "2027-07-20T15:00:00+01:00"
                denied:
                  summary: Fictional demo — a job asking for a variable dec-rar-001 does not cover.
                  value:
                    decision_ref: dec-rar-001
                    status: denied
                    approved_organization_refs: []
                    approved_variables: []
                    authority_organization_ref: org-governance
                    valid_until: "2027-07-20T15:00:00+01:00"
                    reason_code: variable_not_approved
        "400": {description: The check does not match this contract.}
        "404": {description: Decision not found.}
components:
  schemas:
    Ref: {type: string, minLength: 1, maxLength: 100}
    AuthorizationCheck:
      type: object
      additionalProperties: false
      required: [decision_ref, project_ref, requested_by, purpose, target_organization_refs, data_scope]
      properties:
        decision_ref: {$ref: "#/components/schemas/Ref"}
        project_ref: {$ref: "#/components/schemas/Ref"}
        requested_by: {$ref: "#/components/schemas/Ref"}
        purpose: {type: string, minLength: 1, maxLength: 500}
        target_organization_refs: {type: array, minItems: 1, uniqueItems: true, items: {$ref: "#/components/schemas/Ref"}}
        data_scope: {$ref: "#/components/schemas/DataScope"}
    DataScope:
      type: object
      additionalProperties: false
      required: [population, variables]
      properties:
        population:
          type: object
          additionalProperties: false
          minProperties: 1
          properties: {age_min: {type: integer, minimum: 0, maximum: 130}, age_max: {type: integer, minimum: 0, maximum: 130}, encounter_from: {type: string, format: date}, encounter_to: {type: string, format: date}}
        variables: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,99}$"}}
    AuthorizationDecision:
      type: object
      additionalProperties: false
      required: [decision_ref, status, approved_organization_refs, approved_variables, authority_organization_ref]
      properties:
        decision_ref: {$ref: "#/components/schemas/Ref"}
        status: {type: string, enum: [approved, denied]}
        approved_organization_refs: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/Ref"}}
        approved_variables: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,99}$"}}
        authority_organization_ref: {$ref: "#/components/schemas/Ref"}
        valid_until: {type: string, format: date-time}
        reason_code: {type: string, minLength: 1}
