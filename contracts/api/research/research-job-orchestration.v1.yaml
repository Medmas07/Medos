openapi: 3.1.0
info:
  title: Research Job Orchestration API
  version: 1.2.0
  description: |
    HC-182/HC-184 D3 and HC-185 D4 Research Service API. It coordinates
    authorization and Hospital Node execution, validates every controlled
    output before release, then aggregates only outputs that passed. It never
    executes submitted code or reads Hospital Node persistence.
paths:
  /v1/research-jobs:
    post:
      operationId: submitResearchJob
      summary: Submit a governed Compute-to-Data job.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobRequest"}
      responses:
        "202":
          description: Job recorded; inspect status and per-node executions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "409": {description: Job reference already belongs to another request.}
        "422": {description: Invalid bounded job request.}
  /v1/research-jobs/{job_ref}:
    parameters:
      - {name: job_ref, in: path, required: true, schema: {$ref: "#/components/schemas/Ref"}}
      - {name: refresh, in: query, required: false, schema: {type: boolean, default: true}}
    get:
      operationId: getResearchJob
      summary: Read and optionally refresh one job.
      responses:
        "200":
          description: Current job and separate controlled node outcomes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {description: Job not found.}
components:
  schemas:
    Ref: {type: string, minLength: 1, maxLength: 100}
    JobRequest:
      type: object
      required: [job_ref, project_ref, authorization_decision_ref, requested_by, purpose, target_organizations, data_scope, algorithm, output_policy]
      properties:
        job_ref: {$ref: "#/components/schemas/Ref"}
        project_ref: {$ref: "#/components/schemas/Ref"}
        authorization_decision_ref: {$ref: "#/components/schemas/Ref"}
        requested_by: {$ref: "#/components/schemas/Ref"}
        purpose: {type: string, minLength: 1, maxLength: 500}
        target_organizations: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {$ref: "#/components/schemas/Ref"}}
        data_scope: {$ref: "#/components/schemas/DataScope"}
        algorithm: {$ref: "#/components/schemas/Algorithm"}
        output_policy: {$ref: "#/components/schemas/OutputPolicy"}
    Job:
      allOf:
        - {$ref: "#/components/schemas/JobRequest"}
        - type: object
          required: [status, executions, aggregation, mocked]
          properties:
            status: {type: string, enum: [queued, authorizing, dispatching, running, completed, denied, failed]}
            executions: {type: array, items: {$ref: "#/components/schemas/NodeExecution"}}
            aggregation: {$ref: "#/components/schemas/ControlledAggregation"}
            error: {$ref: "#/components/schemas/Problem"}
            mocked: {type: boolean, const: false}
    NodeExecution:
      type: object
      additionalProperties: false
      required: [execution_id, organization_ref, status, mocked, output_validation]
      properties:
        execution_id: {$ref: "#/components/schemas/Ref"}
        organization_ref: {$ref: "#/components/schemas/Ref"}
        status: {type: string, enum: [accepted, authorization_check, queued, running, output_review, completed, denied, failed, cancelled, expired]}
        result: {$ref: "#/components/schemas/ControlledResult"}
        error: {$ref: "#/components/schemas/Problem"}
        mocked: {type: boolean}
        output_validation: {$ref: "#/components/schemas/OutputValidation"}
    OutputValidation:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: {type: string, enum: [pending, passed, rejected, not_applicable]}
        checks:
          type: array
          uniqueItems: true
          items: {type: string, enum: [controlled_result_schema, metadata_schema, disclosure_policy, provenance_binding, timestamp_order, sandbox_controls, bounded_columns, minimum_cell_size]}
        error: {$ref: "#/components/schemas/Problem"}
    ControlledAggregation:
      type: object
      additionalProperties: false
      required: [status, columns, rows, included_organization_refs, excluded_organization_refs, mocked]
      properties:
        status: {type: string, enum: [pending, not_available, released, partial, empty, suppressed, failed]}
        columns: {type: array, uniqueItems: true, items: {type: string}}
        rows: {type: array, description: Cross-node aggregate cells only; never raw or patient-level records., items: {type: array}}
        included_organization_refs: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/Ref"}}
        excluded_organization_refs: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/Ref"}}
        disclosure: {$ref: "#/components/schemas/AggregationDisclosure"}
        provenance: {$ref: "#/components/schemas/AggregationProvenance"}
        mocked: {type: boolean}
        error: {$ref: "#/components/schemas/Problem"}
    AggregationDisclosure:
      type: object
      additionalProperties: false
      required: [status, minimum_cell_size, suppressed_organization_count]
      properties:
        status: {type: string, enum: [passed, partial]}
        minimum_cell_size: {type: integer, minimum: 1}
        suppressed_organization_count: {type: integer, minimum: 0}
    AggregationProvenance:
      type: object
      additionalProperties: false
      required: [algorithm_sha256, authorization_decision_ref, source_organization_refs, excluded_organization_refs]
      properties:
        algorithm_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        authorization_decision_ref: {$ref: "#/components/schemas/Ref"}
        source_organization_refs: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/Ref"}}
        excluded_organization_refs: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/Ref"}}
    DataScope:
      type: object
      additionalProperties: false
      required: [population, variables]
      properties:
        population:
          type: object
          additionalProperties: false
          minProperties: 1
          properties: {age_min: {type: integer, minimum: 0, maximum: 130}, age_max: {type: integer, minimum: 0, maximum: 130}, encounter_from: {type: string, format: date}, encounter_to: {type: string, format: date}}
        variables: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,99}$"}}
    Algorithm:
      type: object
      additionalProperties: false
      required: [language, artifact_ref, sha256, entrypoint]
      properties: {language: {type: string, enum: [python]}, artifact_ref: {type: string, minLength: 1, maxLength: 500}, sha256: {type: string, pattern: "^[a-f0-9]{64}$"}, entrypoint: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,99}$"}}
    OutputPolicy:
      type: object
      additionalProperties: false
      required: [kind, minimum_cell_size, require_disclosure_review]
      properties: {kind: {type: string, enum: [aggregate_table]}, minimum_cell_size: {type: integer, minimum: 1}, require_disclosure_review: {type: boolean, const: true}}
    ControlledResult:
      type: object
      additionalProperties: false
      required: [outcome, columns, rows, disclosure, provenance]
      properties:
        outcome: {type: string, enum: [released, empty, suppressed]}
        columns: {type: array, uniqueItems: true, items: {type: string}}
        rows: {type: array, description: Aggregate cells only; never raw or patient-level records., items: {type: array}}
        disclosure: {$ref: "#/components/schemas/NodeDisclosure"}
        provenance: {$ref: "#/components/schemas/NodeProvenance"}
        sandbox: {$ref: "#/components/schemas/SandboxEvidence"}
    SandboxEvidence:
      type: object
      additionalProperties: false
      required: [mode, python_isolated, site_packages_disabled, environment_cleared, network, filesystem, wall_time_seconds, max_input_bytes, max_output_bytes, os_resource_limits]
      properties:
        mode: {type: string, const: isolated_process}
        python_isolated: {type: boolean, const: true}
        site_packages_disabled: {type: boolean, const: true}
        environment_cleared: {type: boolean, const: true}
        network: {type: string, const: denied}
        filesystem: {type: string, const: denied_after_startup}
        wall_time_seconds: {type: number, const: 2.0}
        max_input_bytes: {type: integer, const: 262144}
        max_output_bytes: {type: integer, const: 65536}
        os_resource_limits: {type: string, enum: [posix_rlimit, parent_enforced]}
    NodeDisclosure:
      type: object
      additionalProperties: false
      required: [status, minimum_cell_size, checked_at]
      properties:
        status: {type: string, enum: [passed, suppressed]}
        minimum_cell_size: {type: integer, minimum: 1}
        checked_at: {type: string, format: date-time}
        reason_code: {type: string, enum: [minimum_cell_size]}
    NodeProvenance:
      type: object
      additionalProperties: false
      required: [algorithm_sha256, authorization_decision_ref, executed_at, source_organization_ref, source_node_ref]
      properties:
        algorithm_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        authorization_decision_ref: {$ref: "#/components/schemas/Ref"}
        executed_at: {type: string, format: date-time}
        source_organization_ref: {$ref: "#/components/schemas/Ref"}
        source_node_ref: {$ref: "#/components/schemas/Ref"}
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        retryable: {type: boolean}
