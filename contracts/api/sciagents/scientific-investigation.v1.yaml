openapi: 3.1.0
info:
  title: SciAgents Integration — Scientific Investigation
  version: 1.1.0
  description: |
    Contract HC-170, version 1.1. The provider-neutral contract between the
    Research Service / Research Portal and this repository's SciAgents
    Integration adapter (`integrations/sciagents/`).

    **SciAgents is an existing external system and is not reimplemented
    here.** This contract does not expose SciAgents' own API. The adapter
    (HC-171) maps it to the observed open `/hypotheses` HTTP and SSE API.
    Hosting, rate limits, service authentication, and supported vocabulary
    remain OPEN (see docs/OPEN_QUESTIONS.md).

    Flow: the caller submits a research question plus exactly two structured
    research concepts (`POST`) and receives a queued investigation, then polls
    it (`GET`) until it is `completed` or `failed`. While it runs, `progress`
    reports what the adapter knows, for progress display (HC-173).

    Boundary rules carried by this contract:

    - **Research use only.** Results are scientific leads for researchers.
      `clinical_use` is always `not_for_clinical_decisions`, and nothing in
      a result becomes clinical truth.
    - **No clinical data leaves for SciAgents.** A request carries only a
      display question, two non-identifying biomedical concept labels, and
      opaque workflow references. It cannot carry patient data, raw records,
      or controlled-result content. The adapter maps only the two concepts to
      SciAgents' keyword-pair API; it does not send the display question.
    - **Every claim is traceable.** Hypotheses reference evidence and
      contradictions, and evidence and contradictions reference citations,
      by id. Every referenced id must exist in the same result.
    - **Provenance is explicit,** including whether the result is mocked.

    v1 result sections: hypotheses, evidence, contradictions, citations.
    SciAgents scores are not calibrated confidence: the adapter must emit a
    null confidence unless the upstream API later provides a suitable value,
    and must not manufacture contradictions from Critic prose.
    Entity resolution, evidence graphs, and novelty checks are not part of
    this version.

    Status: HC-171 implements the server-side adapter and HC-172 serves this
    contract to the Research Portal. Live external connectivity still requires
    an explicitly configured SciAgents endpoint.
paths:
  /v1/investigations:
    post:
      operationId: createInvestigation
      summary: Submit a research question to SciAgents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationRequest"
            examples:
              demoInvestigation:
                summary: Fictional demo — research project proj-001 (HC-005 fixtures).
                value:
                  project_ref: proj-001
                  requested_by: usr-aymen
                  question: >-
                    Quelles pistes de recherche relient la metformine et le diabète ?
                  language: fr
                  concepts:
                    - label: Metformin
                    - label: Diabetes
      responses:
        "202":
          description: Investigation accepted and queued.
          headers:
            Location:
              description: URL of the investigation resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
              examples:
                queued:
                  value:
                    investigation_id: 0b6f5a1e-3c2d-4e7f-9a8b-1c2d3e4f5a6b
                    contract_version: "1.1"
                    project_ref: proj-001
                    requested_by: usr-aymen
                    question: >-
                      Quelles pistes de recherche relient la metformine et le diabète ?
                    concepts: [{label: Metformin}, {label: Diabetes}]
                    status: queued
                    progress: null
                    created_at: "2026-10-10T11:00:00Z"
                    updated_at: "2026-10-10T11:00:00Z"
                    clinical_use: not_for_clinical_decisions
                    notice: >-
                      Research leads from an external system. Not for clinical
                      decisions.
                    result: null
                    error: null
                    provenance:
                      provider:
                        name: SciAgents
                        version: null
                      adapter:
                        name: demo-sciagents-adapter
                        version: "1.0.0"
                      mocked: true
                      upstream_request_ref: null
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          description: SciAgents cannot accept investigations right now. Nothing was queued.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unavailable:
                  value:
                    type: about:blank
                    title: SciAgents unavailable
                    status: 503
                    detail: SciAgents is not reachable. No investigation was created.
                    code: sciagents_unavailable
  /v1/investigations/{investigation_id}:
    get:
      operationId: getInvestigation
      summary: Get an investigation's status, progress, and result.
      parameters:
        - name: investigation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current state of the investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
              examples:
                running:
                  value:
                    investigation_id: 0b6f5a1e-3c2d-4e7f-9a8b-1c2d3e4f5a6b
                    contract_version: "1.1"
                    project_ref: proj-001
                    requested_by: usr-aymen
                    question: >-
                      Quelles pistes de recherche relient la metformine et le diabète ?
                    concepts: [{label: Metformin}, {label: Diabetes}]
                    status: running
                    progress:
                      stage_label: Recherche bibliographique
                      percent: 40
                      updated_at: "2026-10-10T11:00:20Z"
                    created_at: "2026-10-10T11:00:00Z"
                    updated_at: "2026-10-10T11:00:20Z"
                    clinical_use: not_for_clinical_decisions
                    notice: >-
                      Research leads from an external system. Not for clinical
                      decisions.
                    result: null
                    error: null
                    provenance:
                      provider:
                        name: SciAgents
                        version: null
                      adapter:
                        name: demo-sciagents-adapter
                        version: "1.0.0"
                      mocked: true
                      upstream_request_ref: null
                completed:
                  summary: Fictional SciAgents result using canonical HC-005 workflow references.
                  value:
                    investigation_id: 0b6f5a1e-3c2d-4e7f-9a8b-1c2d3e4f5a6b
                    contract_version: "1.1"
                    project_ref: proj-001
                    requested_by: usr-aymen
                    question: >-
                      Quelles pistes de recherche relient la metformine et le diabète ?
                    concepts: [{label: Metformin}, {label: Diabetes}]
                    status: completed
                    progress:
                      stage_label: Terminé
                      percent: 100
                      updated_at: "2026-10-10T11:01:05Z"
                    created_at: "2026-10-10T11:00:00Z"
                    updated_at: "2026-10-10T11:01:05Z"
                    clinical_use: not_for_clinical_decisions
                    notice: >-
                      Research leads from an external system. Not for clinical
                      decisions.
                    result:
                      outcome: findings
                      hypotheses:
                        - hypothesis_id: inv-001-h1
                          statement: >-
                            La metformine pourrait influencer le mécanisme étudié
                            dans le diabète.
                          confidence: null
                          evidence_ids: [inv-001-e1]
                          contradiction_ids: []
                      evidence:
                        - evidence_id: inv-001-e1
                          summary: >-
                            Extrait fictif résolu par le mécanisme de grounding
                            externe pour démontrer le mapping de l'adaptateur.
                          citation_ids: [inv-001-c1]
                      contradictions: []
                      citations:
                        - citation_id: inv-001-c1
                          kind: other
                          title: sciagents-demo-source
                          source: SciAgents grounding
                          identifier: sciagents-demo-source
                          url: null
                    error: null
                    provenance:
                      provider:
                        name: SciAgents
                        version: null
                      adapter:
                        name: demo-sciagents-adapter
                        version: "1.0.0"
                      mocked: true
                      upstream_request_ref: null
                failed:
                  value:
                    investigation_id: 7c1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
                    contract_version: "1.1"
                    project_ref: proj-001
                    requested_by: usr-aymen
                    question: Question de démonstration fictive.
                    concepts: [{label: Metformin}, {label: Diabetes}]
                    status: failed
                    progress:
                      stage_label: Recherche bibliographique
                      percent: 40
                      updated_at: "2026-10-10T11:02:30Z"
                    created_at: "2026-10-10T11:02:00Z"
                    updated_at: "2026-10-10T11:02:30Z"
                    clinical_use: not_for_clinical_decisions
                    notice: >-
                      Research leads from an external system. Not for clinical
                      decisions.
                    result: null
                    error:
                      code: timeout
                      message: SciAgents did not answer in time.
                      retryable: true
                    provenance:
                      provider:
                        name: SciAgents
                        version: null
                      adapter:
                        name: demo-sciagents-adapter
                        version: "1.0.0"
                      mocked: true
                      upstream_request_ref: null
        "404":
          description: No investigation with this id is visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: about:blank
                    title: Investigation not found
                    status: 404
                    code: investigation_not_found
components:
  responses:
    InvalidRequest:
      description: The request does not match this contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidRequest:
              value:
                type: about:blank
                title: Invalid investigation request
                status: 400
                detail: "Invalid or missing fields: question"
                code: invalid_request
  schemas:
    InvestigationRequest:
      type: object
      additionalProperties: false
      required: [project_ref, requested_by, question, concepts]
      properties:
        project_ref:
          $ref: "#/components/schemas/OpaqueRef"
        requested_by:
          description: Opaque reference to the researcher.
          allOf:
            - $ref: "#/components/schemas/OpaqueRef"
        question:
          type: string
          minLength: 1
          maxLength: 2000
        language:
          description: BCP 47 language tag of the question, if known.
          type: string
          pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
        concepts:
          description: Exactly two non-identifying biomedical concepts mapped to SciAgents keywords in order.
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ResearchConcept"

    ResearchConcept:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          description: Biomedical concept label resolvable by SciAgents; never a patient or person name.
          type: string
          minLength: 1
          maxLength: 200

    OpaqueRef:
      description: Opaque identifier. Must not contain a name or other direct identifier.
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"

    Investigation:
      type: object
      additionalProperties: false
      required:
        - investigation_id
        - contract_version
        - project_ref
        - requested_by
        - question
        - concepts
        - status
        - progress
        - created_at
        - updated_at
        - clinical_use
        - notice
        - result
        - error
        - provenance
      properties:
        investigation_id:
          type: string
          format: uuid
        contract_version:
          const: "1.1"
        project_ref:
          $ref: "#/components/schemas/OpaqueRef"
        requested_by:
          $ref: "#/components/schemas/OpaqueRef"
        question:
          type: string
          minLength: 1
        concepts:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ResearchConcept"
        status:
          type: string
          enum: [queued, running, completed, failed]
        progress:
          description: Latest progress the adapter knows; null before any is reported.
          oneOf:
            - $ref: "#/components/schemas/Progress"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        clinical_use:
          const: not_for_clinical_decisions
        notice:
          type: string
          minLength: 1
        result:
          description: Present only when `status` is `completed`.
          oneOf:
            - $ref: "#/components/schemas/InvestigationResult"
            - type: "null"
        error:
          description: Present only when `status` is `failed`.
          oneOf:
            - $ref: "#/components/schemas/InvestigationError"
            - type: "null"
        provenance:
          $ref: "#/components/schemas/Provenance"
      allOf:
        - if:
            properties:
              status:
                const: completed
          then:
            properties:
              result:
                $ref: "#/components/schemas/InvestigationResult"
              error:
                type: "null"
        - if:
            properties:
              status:
                const: failed
          then:
            properties:
              result:
                type: "null"
              error:
                $ref: "#/components/schemas/InvestigationError"
        - if:
            properties:
              status:
                enum: [queued, running]
          then:
            properties:
              result:
                type: "null"
              error:
                type: "null"

    Progress:
      type: object
      additionalProperties: false
      required: [stage_label, percent, updated_at]
      properties:
        stage_label:
          description: Human-readable stage as reported by the adapter. SciAgents' own stage names are not fixed by this contract.
          type: string
          minLength: 1
        percent:
          description: Estimated completion; null when SciAgents gives no estimate.
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        updated_at:
          type: string
          format: date-time

    InvestigationResult:
      type: object
      additionalProperties: false
      required: [outcome, hypotheses, evidence, contradictions, citations]
      properties:
        outcome:
          description: Findings passed the upstream quality gate, or no releasable finding.
          type: string
          enum: [findings, empty]
        hypotheses:
          type: array
          items:
            $ref: "#/components/schemas/Hypothesis"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        contradictions:
          type: array
          items:
            $ref: "#/components/schemas/Contradiction"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"

    Hypothesis:
      type: object
      additionalProperties: false
      required: [hypothesis_id, statement, confidence, evidence_ids, contradiction_ids]
      properties:
        hypothesis_id:
          type: string
          minLength: 1
        statement:
          type: string
          minLength: 1
        confidence:
          description: Confidence as reported by SciAgents, mapped to three levels; null when not reported.
          oneOf:
            - type: string
              enum: [low, moderate, high]
            - type: "null"
        evidence_ids:
          type: array
          items:
            type: string
        contradiction_ids:
          type: array
          items:
            type: string

    Evidence:
      type: object
      additionalProperties: false
      required: [evidence_id, summary, citation_ids]
      properties:
        evidence_id:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        citation_ids:
          type: array
          minItems: 1
          items:
            type: string

    Contradiction:
      type: object
      additionalProperties: false
      required: [contradiction_id, summary, citation_ids]
      properties:
        contradiction_id:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        citation_ids:
          type: array
          minItems: 1
          items:
            type: string

    Citation:
      type: object
      additionalProperties: false
      required: [citation_id, kind, title, source, identifier, url]
      properties:
        citation_id:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [publication, controlled_result, other]
        title:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        identifier:
          description: DOI, PMID, or a controlled result reference, when available.
          type: [string, "null"]
        url:
          type: [string, "null"]

    InvestigationError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [upstream_unavailable, upstream_error, timeout, rejected_by_upstream]
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean

    Provenance:
      type: object
      additionalProperties: false
      required: [provider, adapter, mocked, upstream_request_ref]
      properties:
        provider:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name:
              const: SciAgents
            version:
              description: SciAgents version, when it reports one.
              type: [string, "null"]
        adapter:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name:
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
        mocked:
          description: True when the result comes from fixtures rather than SciAgents.
          type: boolean
        upstream_request_ref:
          description: SciAgents' own id for the request, when available, for support and audit.
          type: [string, "null"]

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [invalid_request, investigation_not_found, sciagents_unavailable]
