openapi: 3.1.0
info:
  title: Federation Node Registry
  version: 1.0.0
  description: |
    Contract HC-142, version 1. The Federation Service's directory of
    Hospital Nodes: which node serves which organization, where to reach
    it, and which versions of hospital-node-federation it answers. The
    federated patient query asks the nodes listed here.

    Boundary rules carried by this contract:

    - **The registry routes; it does not approve.** Approving an
      organization belongs to the Governance Node. Each registration must
      cite the Governance approval decision it relies on
      (`approval.decision_ref`). In v1 the Federation Service cannot check
      that reference, because no Governance approval API exists yet (HC-131).
      Responses say so with `approval.verified: false`. Consumers must not
      present a registration as a Governance approval.
    - **No clinical data.** A registration holds node identity, routing,
      and contract versions only. It never says which patients a node
      holds.
    - **One node per organization.** Federated queries target
      organizations, so each organization has at most one registered node
      (`409 organization_already_registered`).
    - **Compatible nodes only.** A registration must list at least one
      hospital-node-federation version this Federation Service speaks
      (`1.0`); otherwise it is rejected with `400`.

    Node health and supported scopes are capability discovery (HC-143) and
    are not part of this version. Who may call the write operations, and
    how a node proves its identity, are OPEN (docs/OPEN_QUESTIONS.md). In
    v1 these operations are unauthenticated.
paths:
  /v1/registry/nodes:
    get:
      operationId: listNodes
      summary: List registered nodes.
      responses:
        "200":
          description: Every registered node, ordered by `node_ref`. May be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
              examples:
                demoNodes:
                  summary: Fictional demo — Hospitals A and B are registered.
                  value:
                    notice: >-
                      Routing directory only. Approval references are not
                      verified with the Governance Node.
                    nodes:
                      - node_ref: node-hospital-a
                        organization_ref: org-hospital-a
                        base_url: http://localhost:8101
                        contract_versions: ["1.0"]
                        approval:
                          decision_ref: dec-hospital-a
                          verified: false
                        registered_at: "2026-10-10T08:00:00+01:00"
                        updated_at: "2026-10-10T08:00:00+01:00"
                      - node_ref: node-hospital-b
                        organization_ref: org-hospital-b
                        base_url: http://localhost:8102
                        contract_versions: ["1.0"]
                        approval:
                          decision_ref: dec-hospital-b
                          verified: false
                        registered_at: "2026-10-10T08:00:00+01:00"
                        updated_at: "2026-10-10T08:00:00+01:00"
                empty:
                  summary: Nothing is registered yet.
                  value:
                    notice: >-
                      Routing directory only. Approval references are not
                      verified with the Governance Node.
                    nodes: []
  /v1/registry/nodes/{node_ref}:
    parameters:
      - name: node_ref
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/OpaqueRef"
    get:
      operationId: getNode
      summary: Get one registered node.
      responses:
        "200":
          description: The registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRegistration"
              examples:
                hospitalB:
                  value:
                    node_ref: node-hospital-b
                    organization_ref: org-hospital-b
                    base_url: http://localhost:8102
                    contract_versions: ["1.0"]
                    approval:
                      decision_ref: dec-hospital-b
                      verified: false
                    registered_at: "2026-10-10T08:00:00+01:00"
                    updated_at: "2026-10-10T08:00:00+01:00"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: registerNode
      summary: Register a node, or update its registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
            examples:
              hospitalB:
                summary: Fictional demo — Hospital B's node registers.
                value:
                  organization_ref: org-hospital-b
                  base_url: http://localhost:8102
                  contract_versions: ["1.0"]
                  approval_decision_ref: dec-hospital-b
      responses:
        "200":
          description: An existing registration was updated. `registered_at` is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRegistration"
              examples:
                updated:
                  value:
                    node_ref: node-hospital-b
                    organization_ref: org-hospital-b
                    base_url: http://localhost:8112
                    contract_versions: ["1.0"]
                    approval:
                      decision_ref: dec-hospital-b
                      verified: false
                    registered_at: "2026-10-10T08:00:00+01:00"
                    updated_at: "2026-10-10T09:30:00+01:00"
        "201":
          description: The node was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRegistration"
              examples:
                registered:
                  value:
                    node_ref: node-hospital-b
                    organization_ref: org-hospital-b
                    base_url: http://localhost:8102
                    contract_versions: ["1.0"]
                    approval:
                      decision_ref: dec-hospital-b
                      verified: false
                    registered_at: "2026-10-10T08:00:00+01:00"
                    updated_at: "2026-10-10T08:00:00+01:00"
        "400":
          description: The request does not match this contract, or the node speaks no supported contract version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unsupportedVersion:
                  value:
                    type: about:blank
                    title: Invalid node registration
                    status: 400
                    detail: "No supported hospital-node-federation version in contract_versions; supported: 1.0"
                    code: invalid_request
        "409":
          description: Another node is already registered for this organization.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                organizationTaken:
                  value:
                    type: about:blank
                    title: Organization already registered
                    status: 409
                    detail: org-hospital-b is already served by node-hospital-b.
                    code: organization_already_registered
    delete:
      operationId: deregisterNode
      summary: Remove a node from the registry. Federated queries stop asking it.
      responses:
        "204":
          description: The node was removed.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    NotFound:
      description: No node is registered under this reference.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              value:
                type: about:blank
                title: Node not found
                status: 404
                detail: node-hospital-c is not registered.
                code: node_not_found
  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [organization_ref, base_url, contract_versions, approval_decision_ref]
      properties:
        organization_ref:
          $ref: "#/components/schemas/OpaqueRef"
        base_url:
          $ref: "#/components/schemas/BaseUrl"
        contract_versions:
          $ref: "#/components/schemas/ContractVersions"
        approval_decision_ref:
          description: The Governance decision approving this organization. Not verified in v1.
          allOf:
            - $ref: "#/components/schemas/OpaqueRef"

    NodeRegistration:
      type: object
      additionalProperties: false
      required:
        - node_ref
        - organization_ref
        - base_url
        - contract_versions
        - approval
        - registered_at
        - updated_at
      properties:
        node_ref:
          $ref: "#/components/schemas/OpaqueRef"
        organization_ref:
          $ref: "#/components/schemas/OpaqueRef"
        base_url:
          $ref: "#/components/schemas/BaseUrl"
        contract_versions:
          $ref: "#/components/schemas/ContractVersions"
        approval:
          type: object
          additionalProperties: false
          required: [decision_ref, verified]
          properties:
            decision_ref:
              $ref: "#/components/schemas/OpaqueRef"
            verified:
              description: Whether the Federation Service checked the decision with the Governance Node. Always false in v1.
              const: false
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NodeList:
      type: object
      additionalProperties: false
      required: [notice, nodes]
      properties:
        notice:
          type: string
          minLength: 1
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeRegistration"

    BaseUrl:
      description: Absolute http(s) URL of the node's Federation interface, without credentials, query, or fragment.
      type: string
      format: uri
      pattern: "^https?://[^/?#@\\s]+(/[^?#\\s]*)?$"
      maxLength: 2048

    ContractVersions:
      description: hospital-node-federation versions the node answers.
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        pattern: "^[0-9]+\\.[0-9]+$"

    OpaqueRef:
      description: Opaque identifier. Must not contain a name or other direct identifier.
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [invalid_request, node_not_found, organization_already_registered]
