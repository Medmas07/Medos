openapi: 3.1.0
info:
  title: Synchronization Authorization Check
  version: 1.2.0
  description: |
    Contract HC-144, version 1. Provided by the Governance Node. Before the
    Federation Service asks any Hospital Node on the basis of a
    synchronization decision, it asks the Governance Node whether that
    decision currently authorizes this exact request.

    Boundary rules carried by this contract:

    - **Governance decides; Federation enforces.** Approving a
      synchronization and issuing its temporary authorization belong to the
      Governance Node. The Federation Service never approves, extends, or
      widens an authorization. It only asks this question and obeys the
      answer.
    - **Temporary by construction.** An authorization is valid only between
      its decision and `valid_until`. After that, the check answers
      `denied` with reason `expired`.
    - **Exact match.** The requesting organization and patient must be the
      ones the decision names. The requested scope must be inside the
      approved scope, and the purpose must match. Any difference is
      `denied`, with the first failing reason.
    - **Targets come from Governance.** An `authorized` answer lists the
      organizations the requester may query. The Federation Service asks
      only those organizations' nodes, never every registered node.
    - **Deny by default.** If the Governance Node cannot be reached or
      answers outside this contract, the Federation Service asks no node.
    - **Consent still holds (since 1.1.0, HC-136).** When an approval
      relies on a patient grant, the Governance Node re-verifies that grant
      with the Hospital Node of the target organization, which holds and
      enforces it (patient-access-grants.v1.yaml), once every other check
      passes. A grant revoked, expired, or unknown there is `denied` with
      reason `revoked`. If that node cannot answer within its contract, the
      answer is `503 consent_unavailable` and nothing is authorized.
    - **Minimised.** The request carries opaque references only. Nothing
      clinical is sent to the Governance Node.
    - **Signed (since 1.2.0, HC-214).** When the Governance Node signs
      (`GOVERNANCE_FEDERATION_SIGNING=ed25519`), an `authorized` answer
      carries `signed_authorization`: a statement of exactly what was
      authorized, signed with the Authority's private key. The Federation
      Service passes it unchanged to the target Hospital Nodes
      (hospital-node-federation.v1, `signed_authorization`), and each node
      verifies it with the Authority's public key, without asking the
      Governance Node. It is `null` when denied, or when the Governance
      Node does not sign. The Federation Service never creates, alters, or
      widens it.

    Each Hospital Node still enforces the authorization itself
    (hospital-node-federation.v1). This check stops a query before it
    reaches any node; it does not replace the nodes' own checks.

    Signed authorization format (1.2.0, ADR-0015): a compact JWS (RFC 7515)
    signed with Ed25519, `alg: EdDSA` (RFC 8037). The protected header is
    exactly `alg`, `kid`, and `typ`: `kid` is the RFC 7638 thumbprint of the
    Authority's public key, and `typ` is `governance-authorization+jwt`.
    The claims are exactly:

    - `iss`: the Governance / Ethics Authority's organization reference;
    - `sub`: the `decision_ref` checked;
    - `aud`: the `target_organization_refs` authorized; a node accepts the
      token only if its own organization is listed;
    - `jti`: a unique token identifier;
    - `iat`, `exp`: issue and expiry, in seconds since the epoch (UTC).
      `exp` is the earlier of the decision's `valid_until` and five minutes
      after the check, so that an expired decision or a withdrawn patient
      grant stops the exchange within five minutes;
    - `basis`: always `synchronization_decision`;
    - `requester_organization_ref`, `actor_ref`, `patient_ref`, `scope`,
      `purpose`: the exchange asked, exactly as in the check request. `scope`
      is what was asked, never the wider approved scope.

    Not in 1.2.0: authentication between services (who may ask this check),
    key rotation beyond replacing the key, revocation of an issued token
    before its `exp`, and replay detection. They remain OPEN
    (docs/OPEN_QUESTIONS.md).

    Status: the Federation Service calls this contract (HC-144), and the
    Governance Node serves it (HC-132) for the synchronization decisions it
    holds in memory (contracts/api/governance/synchronization-requests.v1.yaml).
    It signs authorized answers when started with signing on (HC-214); off
    by default.
    Every answer, authorized or denied, is recorded with `actor_ref` in the
    Node's governance audit trail before it is given
    (contracts/api/governance/governance-audit-events.v1.yaml, HC-134);
    the patient, scope, and purpose are not recorded there. `revoked` is
    returned when the patient grant an approval relies on is withdrawn at
    the Hospital Node holding it (HC-136); a decision itself cannot be
    revoked yet. A `503` is audited as a denial (`consent_unavailable`).
paths:
  /v1/synchronization-authorizations/{decision_ref}/checks:
    parameters:
      - name: decision_ref
        in: path
        required: true
        description: The Governance decision that approved the synchronization request.
        schema:
          $ref: "#/components/schemas/OpaqueRef"
    post:
      operationId: checkSynchronizationAuthorization
      summary: Does this decision authorize this request now?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
            examples:
              hospitalAAsksHospitalB:
                summary: >-
                  Fictional demo — Hospital A checks the step-20 approval of
                  synchronization request sync-001 for Patient A.
                value:
                  requester_organization_ref: org-hospital-a
                  actor_ref: clin-x
                  patient_ref: pat-a
                  scope: [medications]
                  purpose: "Continuité des soins : consultation de cardiologie"
      responses:
        "200":
          description: The answer. A `denied` answer is still a `200`; it is a result, not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
              examples:
                authorized:
                  summary: >-
                    Fictional demo — the decision approving sync-001 (created
                    at runtime in demo step 20) authorizes Hospital B for 13
                    days: the 30 days requested are capped by the end of
                    Patient A's grant (synchronization-requests.v1.yaml).
                  value:
                    decision_ref: dec-sync-001
                    outcome: authorized
                    reason: null
                    target_organization_refs: [org-hospital-b]
                    scope: [lab_reports, medications]
                    purpose: "Continuité des soins : consultation de cardiologie"
                    valid_until: "2026-10-23T10:00:00+01:00"
                    checked_at: "2026-10-10T10:30:00+01:00"
                    signed_authorization: null
                authorizedSigned:
                  summary: >-
                    Fictional demo — the same check, answered by a Governance
                    Node that signs (HC-214). The token is signed with a
                    throwaway example key; its claims name exactly the
                    exchange asked (scope [medications]) for Hospital B, for
                    five minutes.
                  value:
                    decision_ref: dec-sync-001
                    outcome: authorized
                    reason: null
                    target_organization_refs: [org-hospital-b]
                    scope: [lab_reports, medications]
                    purpose: "Continuité des soins : consultation de cardiologie"
                    valid_until: "2026-10-23T10:00:00+01:00"
                    checked_at: "2026-10-10T10:30:00+01:00"
                    signed_authorization: eyJhbGciOiJFZERTQSIsImtpZCI6IjdzazhZcFNYaC1hWGkzNE14ck9Cd0pjTWZaaHgxZW9OdHByUFV1ckJjeFkiLCJ0eXAiOiJnb3Zlcm5hbmNlLWF1dGhvcml6YXRpb24rand0In0..EK3smiXiqr9cv3zSP0RIBIfLeAbwnu3eNx560QcUodFuxNKnCighbiDlMda6Y9S3ivNr2RcT66Y1wT3JO9fSBw
                expired:
                  summary: Fictional demo — dec-sync-002 expired on 2026-03-12.
                  value:
                    decision_ref: dec-sync-002
                    outcome: denied
                    reason: expired
                    target_organization_refs: []
                    scope: []
                    purpose: null
                    valid_until: "2026-03-12T14:30:00+01:00"
                    checked_at: "2026-10-10T10:30:00+01:00"
                    signed_authorization: null
                grantRevoked:
                  summary: >-
                    Fictional demo — after dec-sync-001, Patient A revokes
                    grant-a-drx on Hospital B (patient-access-grants.v1.yaml):
                    the next check is denied.
                  value:
                    decision_ref: dec-sync-001
                    outcome: denied
                    reason: revoked
                    target_organization_refs: []
                    scope: []
                    purpose: null
                    valid_until: "2026-10-23T10:00:00+01:00"
                    checked_at: "2026-10-10T10:30:00+01:00"
                    signed_authorization: null
                rejected:
                  summary: Fictional demo — dec-sync-003 rejected sync-003.
                  value:
                    decision_ref: dec-sync-003
                    outcome: denied
                    reason: not_approved
                    target_organization_refs: []
                    scope: []
                    purpose: null
                    valid_until: null
                    checked_at: "2026-10-10T10:30:00+01:00"
                    signed_authorization: null
        "400":
          description: The request does not match this contract.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidRequest:
                  value:
                    type: about:blank
                    title: Invalid authorization check
                    status: 400
                    detail: "Invalid or missing fields: scope"
                    code: invalid_request
        "503":
          description: |
            The approval relies on a patient grant, and the Hospital Node
            holding it could not be asked or answered outside its contract.
            Nothing is authorized; the Federation Service asks no node.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                consentUnavailable:
                  summary: Fictional demo — Hospital B is not running.
                  value:
                    type: about:blank
                    title: Consent unavailable
                    status: 503
                    detail: "The patient grant could not be re-verified: the Hospital Node of org-hospital-b could not be reached."
                    code: consent_unavailable
components:
  schemas:
    CheckRequest:
      type: object
      additionalProperties: false
      required: [requester_organization_ref, actor_ref, patient_ref, scope, purpose]
      properties:
        requester_organization_ref:
          $ref: "#/components/schemas/OpaqueRef"
        actor_ref:
          description: The accountable person behind the query, for Governance's audit trail.
          allOf:
            - $ref: "#/components/schemas/OpaqueRef"
        patient_ref:
          $ref: "#/components/schemas/OpaqueRef"
        scope:
          $ref: "#/components/schemas/Scope"
        purpose:
          type: string
          minLength: 1
          maxLength: 200

    CheckResult:
      type: object
      additionalProperties: false
      required:
        - decision_ref
        - outcome
        - reason
        - target_organization_refs
        - scope
        - purpose
        - valid_until
        - checked_at
        - signed_authorization
      properties:
        decision_ref:
          $ref: "#/components/schemas/OpaqueRef"
        outcome:
          type: string
          enum: [authorized, denied]
        reason:
          description: Why the request is denied; null when authorized.
          oneOf:
            - type: string
              enum:
                - not_found
                - not_approved
                - not_yet_valid
                - expired
                - revoked
                - requester_mismatch
                - patient_mismatch
                - scope_exceeded
                - purpose_mismatch
            - type: "null"
        target_organization_refs:
          description: Organizations the requester may query under this decision. Empty when denied.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OpaqueRef"
        scope:
          description: The approved scope. Empty when denied.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ScopeItem"
        purpose:
          description: The approved purpose; null when denied.
          type: [string, "null"]
        valid_until:
          description: End of the temporary authorization, when the decision has one.
          type: [string, "null"]
          format: date-time
        checked_at:
          type: string
          format: date-time
        signed_authorization:
          description: >-
            Since 1.2.0 (HC-214). The Governance Node's signed statement of this
            authorization, in the format described above; null when denied or
            when the Governance Node does not sign.
          oneOf:
            - $ref: "#/components/schemas/SignedAuthorization"
            - type: "null"
      allOf:
        - if:
            properties:
              outcome:
                const: authorized
          then:
            properties:
              reason:
                type: "null"
              target_organization_refs:
                minItems: 1
              scope:
                minItems: 1
              purpose:
                type: string
              valid_until:
                type: string
          else:
            properties:
              reason:
                type: string
              target_organization_refs:
                maxItems: 0
              scope:
                maxItems: 0
              purpose:
                type: "null"
              signed_authorization:
                type: "null"

    Scope:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ScopeItem"

    ScopeItem:
      type: string
      enum: [encounters, medications, lab_reports]

    SignedAuthorization:
      description: >-
        A compact JWS: base64url header, claims, and Ed25519 signature,
        separated by dots. The same constraints as `signed_authorization`
        in hospital-node-federation.v1.yaml.
      type: string
      maxLength: 4096
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'

    OpaqueRef:
      description: Opaque identifier. Must not contain a name or other direct identifier.
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [invalid_request, consent_unavailable]
