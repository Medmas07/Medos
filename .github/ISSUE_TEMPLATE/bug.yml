name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include patient data, personal data, credentials, or secrets.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, non-sensitive reproduction steps.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria
    validations:
      required: true
