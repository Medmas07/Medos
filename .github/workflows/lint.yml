name: Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/ai/**"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "services/ai/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  ai-services-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run lint
        run: |
          ruff check .
          ruff format --check .
