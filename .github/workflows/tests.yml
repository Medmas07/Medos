name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/ai/**"
      - "services/federation/**"
      - "demo-data/**"
      - "contracts/**"
      - "tests/contracts/**"
      - "infrastructure/packaging/**"
      - "infrastructure/docker/hospital-node/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "services/ai/**"
      - "services/federation/**"
      - "demo-data/**"
      - "contracts/**"
      - "tests/contracts/**"
      - "infrastructure/packaging/**"
      - "infrastructure/docker/hospital-node/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  ai-services-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest

  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest

  federation-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/federation/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest

  hospital-node-package-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/packaging/hospital-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infrastructure/packaging/hospital-node/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: |
          pytest
